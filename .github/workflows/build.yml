name: Build Check
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
    - name: Build BD
      run: npm run build
    - name: Check build status
      run: |
        if [ -d ".next" ]; then
          echo "BD build successful!"
        else
          echo "BD build failed!"
          exit 1
        fi